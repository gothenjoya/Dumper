name: Update Roblox Offsets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: roblox-offsets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Update offsets
        run: python Updater.py

      - name: Validate and commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------
          # Validate file
          # --------------------------------------------------

          test -f Offsets.hpp || {
            echo "::error::Offsets.hpp was not generated."
            exit 1
          }

          SIZE=$(wc -c < Offsets.hpp)

          if (( SIZE < 1000 )); then
            echo "::error::Offsets.hpp is too small (${SIZE} bytes)."
            exit 1
          fi

          grep -q "ClientVersion" Offsets.hpp || {
            echo "::error::ClientVersion missing."
            exit 1
          }

          grep -q "Total Offsets" Offsets.hpp || {
            echo "::error::Total Offsets missing."
            exit 1
          }

          VERSION=$(grep -oP 'ClientVersion\s*=\s*"\K[^"]+' Offsets.hpp | head -n1)
          TOTAL=$(grep -oP 'Total Offsets\s*:\s*\K[0-9]+' Offsets.hpp | head -n1)

          test -n "$VERSION" || {
            echo "::error::Could not read ClientVersion."
            exit 1
          }

          test -n "$TOTAL" || {
            echo "::error::Could not read Total Offsets."
            exit 1
          }

          echo "Version: $VERSION"
          echo "Offsets: $TOTAL"
          echo "Size:    $SIZE bytes"

          # --------------------------------------------------
          # Check for changes
          # --------------------------------------------------

          if git diff --quiet -- Offsets.hpp; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          # --------------------------------------------------
          # Commit
          # --------------------------------------------------

          git config user.name "G0THENJ0YA"
          git config user.email "contact@synapsexisasnake.com"

          git add Offsets.hpp

          git commit -m "Update offsets → $VERSION ($TOTAL offsets)"

          echo "Created commit:"
          git log -1 --oneline

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3..."

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push successful."
              exit 0
            fi

            if (( attempt < 3 )); then
              echo "Push failed. Updating remote state..."
              git fetch origin "${GITHUB_REF_NAME}"

              git rebase "origin/${GITHUB_REF_NAME}"

              sleep $((attempt * 3))
            fi
          done

          echo "::error::Failed to push offsets after 3 attempts."
          exit 1

      - name: Done
        if: success()
        run: |
          echo "======================================"
          echo " Roblox Offsets Update Complete"
          echo "======================================"
